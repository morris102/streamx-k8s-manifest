apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cms-portal.fullname" . }}-secret
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | quote }}
  DB_HOST: {{ .Values.secrets.DB_HOST | quote }}
  DB_NAME: {{ .Values.secrets.DB_NAME | quote }}
  DB_USER: {{ .Values.secrets.DB_USER | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}